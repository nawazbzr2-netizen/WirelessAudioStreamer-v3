name: Apply screen cast sources

"on":
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble sources from base64 parts
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          ss = base64.b64decode(
              Path("scripts/screen_b64/ss_a.b64").read_text().strip()
              + Path("scripts/screen_b64/ss_b.b64").read_text().strip()
          ).decode()
          ma = base64.b64decode(
              Path("scripts/screen_b64/ma_a.b64").read_text().strip()
              + Path("scripts/screen_b64/ma_b.b64").read_text().strip()
          ).decode()
          assert "startScreenSend" in ss and "STREAM_SCREEN" in ss
          assert "btnScreenRecv" in ma
          Path("app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt").write_text(ss)
          Path("app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt").write_text(ma)
          print("SS", len(ss), "MA", len(ma))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          git add app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt
          git commit -m "Add full screen live cast (StreamingService + MainActivity)" || echo nothing
          git push origin HEAD:main

name: Apply screen cast sources

"on":
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch StreamingService and MainActivity for screen cast
        run: |
          python3 scripts/patch_ss_screen.py
          python3 scripts/patch_ma_screen.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          git add app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt
          git commit -m "Enable full screen live cast in StreamingService + MainActivity" || echo nothing
          git push origin HEAD:main

name: Restore core sources

"on":
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore from good commit
        run: |
          git show 0269a1cb:app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt > app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          git show 0269a1cb:app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt > app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt
          wc -c app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          wc -c app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt

      - name: Apply patches
        run: |
          python3 scripts/patch_streaming_service.py
          python3 scripts/patch_main_activity.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          git add app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt
          git status
          git commit -m "Restore StreamingService + MainActivity (Mic/Camera/MP4 fixes)" || echo "nothing"
          git push origin HEAD:main

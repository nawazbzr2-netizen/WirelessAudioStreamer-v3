name: Restore core sources
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore StreamingService and MainActivity from good commit
        run: |
          git show 0269a1cb:app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt > app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          git show 0269a1cb:app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt > app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt
      - name: Apply Mic and Camera patches to StreamingService
        run: |
          python3 << 'PY2'
          from pathlib import Path
          t = Path("app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt").read_text()
          old = """    private fun onCaptured(pcm: ShortArray) {
        if (!active || !peerReady()) return
        val c = cipher ?: return
        lastAudioMs = System.currentTimeMillis()
        val frame = c.seal(Protocol.T_AUDIO, session, seq++, Protocol.buildAudioPlain(pcm, channels))
        if (mode == MODE_WIFI || mode == MODE_INTERNET) {
            val a = peerAddr ?: return
            udpOut?.send(frame, frame.size, a, Protocol.PORT_AUDIO)
        } else bt?.send(frame)
    }

    private fun startCameraSend() {
        val useFront = streamType == Protocol.STREAM_CAMERA_FRONT
        val cam = CameraStreamer(this, useFront) { jpeg -> sendCameraFrame(jpeg) }
        cameraStreamer = cam
        if (!cam.start()) stopEverything(getString(R.string.status_capture_failed), true)
    }"""
          new = """    private fun onCaptured(pcm: ShortArray) {
        if (!active) return
        val canSend = when {
            mode == MODE_BT -> btConnected
            streamType == Protocol.STREAM_MIC ||
            streamType == Protocol.STREAM_CAMERA_BACK ||
            streamType == Protocol.STREAM_CAMERA_FRONT ->
                (peerAddr != null && peerIp.isNotBlank()) || mode == MODE_INTERNET
            else -> peerReady()
        }
        if (!canSend) return
        val c = cipher ?: return
        lastAudioMs = System.currentTimeMillis()
        val frame = c.seal(Protocol.T_AUDIO, session, seq++, Protocol.buildAudioPlain(pcm, channels))
        if (mode == MODE_WIFI || mode == MODE_INTERNET) {
            val a = peerAddr ?: return
            udpOut?.send(frame, frame.size, a, Protocol.PORT_AUDIO)
        } else bt?.send(frame)
    }

    private fun startCameraSend() {
        val useFront = streamType == Protocol.STREAM_CAMERA_FRONT
        val cam = CameraStreamer(this, useFront) { jpeg -> sendCameraFrame(jpeg) }
        cameraStreamer = cam
        if (!cam.start()) {
            stopEverything(getString(R.string.status_capture_failed), true)
            return
        }
        try { micCapturer?.stop() } catch (_: Exception) {}
        val mic = MicCapturer(channels) { pcm -> onCaptured(pcm) }
        micCapturer = mic
        mic.start()
    }"""
          if old not in t:
              raise SystemExit("ss block1 not found")
          t = t.replace(old, new, 1)
          old2 = """        jb.put(o.seq, audio.pcm)
        lastAudioMs = System.currentTimeMillis()
        lastFrom = fromIp ?: "Bluetooth"
        lastFromIp = lastFrom"""
          new2 = """        jb.put(o.seq, audio.pcm)
        lastAudioMs = System.currentTimeMillis()
        lastFrom = fromIp ?: "Bluetooth"
        lastFromIp = lastFrom
        try {
            sendBroadcast(
                Intent("com.wireless.audiostreamer.AUDIO_PCM")
                    .setPackage(packageName)
                    .putExtra("pcm", audio.pcm)
                    .putExtra("ch", audio.channels)
            )
        } catch (_: Exception) {}"""
          if old2 not in t:
              raise SystemExit("ss block2 not found")
          t = t.replace(old2, new2, 1)
          Path("app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt").write_text(t)
          print("StreamingService patched OK")
          PY2
      - name: Apply MainActivity patches
        run: |
          python3 << 'PY3'
          from pathlib import Path
          ma = Path("app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt").read_text()
          ma = ma.replace(
              "import com.wireless.audiostreamer.audio.ReceiverVideoWriter",
              "import com.wireless.audiostreamer.audio.ReceiverMp4Writer"
          )
          ma = ma.replace(
              "private var videoWriter: ReceiverVideoWriter? = null",
              """private var videoWriter: ReceiverMp4Writer? = null
    private val audioPcmReceiver = object : BroadcastReceiver() {
        override fun onReceive(context: Context?, intent: Intent?) {
            val pcm = intent?.getShortArrayExtra("pcm") ?: return
            val ch = intent.getIntExtra("ch", 1)
            videoWriter?.writePcm(pcm, ch)
        }
    }"""
          )
          if "import android.content.BroadcastReceiver" not in ma:
              ma = ma.replace("import android.content.Context", "import android.content.BroadcastReceiver\nimport android.content.Context")
          ma = ma.replace(
              'ContextCompat.registerReceiver(this, cameraReceiver, IntentFilter("com.wireless.audiostreamer.CAMERA_FRAME"), ContextCompat.RECEIVER_NOT_EXPORTED)',
              """ContextCompat.registerReceiver(this, cameraReceiver, IntentFilter("com.wireless.audiostreamer.CAMERA_FRAME"), ContextCompat.RECEIVER_NOT_EXPORTED)
        ContextCompat.registerReceiver(this, audioPcmReceiver, IntentFilter("com.wireless.audiostreamer.AUDIO_PCM"), ContextCompat.RECEIVER_NOT_EXPORTED)"""
          )
          ma = ma.replace(
              "try { unregisterReceiver(cameraReceiver) } catch (_: Exception) {}",
              """try { unregisterReceiver(cameraReceiver) } catch (_: Exception) {}
        try { unregisterReceiver(audioPcmReceiver) } catch (_: Exception) {}"""
          )
          old_btns = """        findViewById<Button>(R.id.btnCamRecv).setOnClickListener {
            openFeature(Protocol.STREAM_CAMERA_BACK)
            openCameraFullscreen()
        }
        findViewById<Button>(R.id.btnCamStop).setOnClickListener { closeCameraFullscreen() }
        findViewById<Button>(R.id.btnCamPhoto).setOnClickListener { takePhoto() }
        findViewById<Button>(R.id.btnCamVideo).setOnClickListener { toggleVideoRecord() }
        findViewById<Button>(R.id.btnCamVideoStop).setOnClickListener { stopVideoRecord() }

        findViewById<Button>(R.id.btnCamFrontRecv).setOnClickListener {
            openFeature(Protocol.STREAM_CAMERA_FRONT)
            openCameraFullscreen()
        }
        findViewById<Button>(R.id.btnCamFrontStop).setOnClickListener { closeCameraFullscreen() }"""
          new_btns = """        findViewById<Button>(R.id.btnCamRecv).setOnClickListener {
            openFeature(Protocol.STREAM_CAMERA_BACK)
            openCameraFullscreen()
        }
        findViewById<Button>(R.id.btnCamStop).setOnClickListener { closeCameraFullscreen() }
        findViewById<Button>(R.id.btnCamVideoStop).setOnClickListener { toggleVideoRecord() }

        findViewById<Button>(R.id.btnCamFrontRecv).setOnClickListener {
            openFeature(Protocol.STREAM_CAMERA_FRONT)
            openCameraFullscreen()
        }
        findViewById<Button>(R.id.btnCamFrontStop).setOnClickListener { closeCameraFullscreen() }
        findViewById<Button>(R.id.btnCamFrontRecord).setOnClickListener { toggleVideoRecord() }"""
          if old_btns not in ma:
              raise SystemExit("ma buttons block not found")
          ma = ma.replace(old_btns, new_btns, 1)
          ma = ma.replace("ReceiverVideoWriter(this)", "ReceiverMp4Writer(this)")
          ma = ma.replace(
              "btnCamRec?.text = getString(R.string.btn_stop_video)",
              """btnCamRec?.text = getString(R.string.btn_stop_recording)
            try { findViewById<Button>(R.id.btnCamVideoStop).text = getString(R.string.btn_stop_recording) } catch (_: Exception) {}
            try { findViewById<Button>(R.id.btnCamFrontRecord).text = getString(R.string.btn_stop_recording) } catch (_: Exception) {}"""
          )
          ma = ma.replace(
              """    private fun openCameraFullscreen() {
        cameraOverlay?.visibility = View.VISIBLE
        imgCamera.visibility = View.VISIBLE
        btnCamRec?.text = getString(R.string.btn_video)
    }""",
              """    private fun openCameraFullscreen() {
        cameraOverlay?.visibility = View.VISIBLE
        imgCamera.visibility = View.VISIBLE
        btnCamRec?.text = getString(R.string.btn_start_recording)
        try { findViewById<Button>(R.id.btnCamVideoStop).text = getString(R.string.btn_start_recording) } catch (_: Exception) {}
        try { findViewById<Button>(R.id.btnCamFrontRecord).text = getString(R.string.btn_start_recording) } catch (_: Exception) {}
    }"""
          )
          ma = ma.replace(
              "btnCamRec?.text = getString(R.string.btn_video)",
              """btnCamRec?.text = getString(R.string.btn_start_recording)
        try { findViewById<Button>(R.id.btnCamVideoStop).text = getString(R.string.btn_start_recording) } catch (_: Exception) {}
        try { findViewById<Button>(R.id.btnCamFrontRecord).text = getString(R.string.btn_start_recording) } catch (_: Exception) {}"""
          )
          Path("app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt").write_text(ma)
          print("MainActivity patched OK")
          PY3
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wireless/audiostreamer/service/StreamingService.kt
          git add app/src/main/java/com/wireless/audiostreamer/ui/MainActivity.kt
          git commit -m "Restore StreamingService + MainActivity with Mic/Camera/MP4 fixes" || echo "no changes"
          git push
